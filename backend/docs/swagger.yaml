        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a label
      tags:
      - labels
    put:
      consumes:
      - application/json
      description: Requires labels.edit.
      parameters:
      - description: Label ID
        in: path
        name: id
        required: true
        type: integer
      - description: Label
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LabelRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
