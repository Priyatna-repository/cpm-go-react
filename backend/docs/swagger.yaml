  handlers.ProjectUserRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.RoleResponse:
    properties:
      id:
        example: 2
        type: integer
      name:
        example: manager
        type: string
      permissions:
        items:
          type: string
        type: array
      version:
        example: 1
        type: integer
    type: object
  handlers.UpdateRolePermissionsRequest:
    properties:
      permissions:
        items:
          type: string
        type: array
      version:
        type: integer
    required:
    - version
    type: object
  handlers.UserListResponses:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.UserResponses'
        type: array
      meta:
        properties:
          current_page:
            type: integer
          last_page:
            type: integer
          total:
            type: integer
        type: object
    type: object
  handlers.UserResponse:
    properties:
      email:
        example: admin@example.com
        type: string
      id:
        example: 1
        type: integer
      name:
        example: Admin User
        type: string
      permissions:
        items:
          type: string
        type: array
      role:
        example: admin
        type: string
    type: object
  handlers.UserResponses:
    properties:
      address:
        type: string
      archived_at:
        type: string
      avatar:
        type: string
      email:
        type: string
      id:
        type: integer
      job_title:
        type: string
      name:
        type: string
      phone:
        type: string
      role:
        type: string
    type: object
info:
  contact: {}
  description: Backend API for the Construction Project Manager application.
  title: CPM API
  version: "0.1"
paths:
  /api/v1/auth/google:
    post:
      consumes:
      - application/json
      description: Verifies a Google Identity Services ID token and logs in an existing
        user (matched by google_id or email). Does not create new accounts.
      parameters:
      - description: Google ID token
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.GoogleLoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "503":
          description: Service Unavailable
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in with Google
      tags:
      - auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      description: Validates credentials and returns an access token; sets an httpOnly
        refresh-token cookie.
      parameters:
      - description: Credentials
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handlers.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Log in
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      description: Revokes the current refresh token and clears its cookie.
      responses:
        "204":
          description: No Content
      summary: Log out
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      description: Rotates the refresh-token cookie and returns a new access token.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LoginResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Refresh access token
      tags:
      - auth
  /api/v1/client-companies:
    get:
      description: Paginated, searchable. Requires client_company.view.
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Search by name or email
        in: query
        name: search
        type: string
      - description: Show archived instead of active
        in: query
        name: archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ClientCompanyListResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List client companies
      tags:
      - client-companies
    post:
      consumes:
      - multipart/form-data
      description: multipart/form-data body (logo file is optional). Requires client_company.create.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.ClientCompanyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a client company
      tags:
      - client-companies
  /api/v1/client-companies/{id}:
    delete:
      parameters:
      - description: Client company ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Archive a client company
      tags:
      - client-companies
    get:
      parameters:
      - description: Client company ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ClientCompanyResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a client company
      tags:
      - client-companies
    put:
      consumes:
      - multipart/form-data
      description: multipart/form-data body (logo file is optional). Requires client_company.edit.
      parameters:
      - description: Client company ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ClientCompanyResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Update a client company
      tags:
      - client-companies
  /api/v1/client-companies/{id}/force:
    delete:
      parameters:
      - description: Client company ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Permanently delete a client company
      tags:
      - client-companies
  /api/v1/client-companies/{id}/restore:
    post:
      parameters:
      - description: Client company ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Restore an archived client company
      tags:
      - client-companies
  /api/v1/client-user-accounts:
    get:
      description: Paginated, searchable. Scope (internal staff vs client) is fixed
        per route. Requires the matching view permission.
      parameters:
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Search by name or email
        in: query
        name: search
        type: string
      - description: Show archived instead of active
        in: query
        name: archived
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserListResponses'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: List users
      tags:
      - users
    post:
      consumes:
      - multipart/form-data
      description: multipart/form-data body (avatar file is optional). Password is
        required on create.
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.UserResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Create a user
      tags:
      - users
  /api/v1/client-user-accounts/{id}:
    delete:
      description: Prevents the archived user from logging in. Cannot archive yourself.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Archive a user
      tags:
      - users
    get:
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UserResponses'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Get a user
      tags:
      - users
    put:
      consumes:
      - multipart/form-data
      description: multipart/form-data body. Leave password blank to keep the current
        one.
      parameters:
      - description: User ID
        in: path
        name: id
        required: true
        type: integer
      produces:
