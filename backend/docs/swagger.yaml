  handlers.ClientUserResponse:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.CountryResponse:
    properties:
      id:
        example: 1
        type: integer
      name:
        example: Indonesia
        type: string
    type: object
  handlers.CurrencyResponse:
    properties:
      code:
        example: IDR
        type: string
      decimals:
        example: 2
        type: integer
      id:
        example: 1
        type: integer
      name:
        example: Rupiah
        type: string
      symbol:
        example: Rp
        type: string
    type: object
  handlers.GoogleLoginRequest:
    properties:
      credential:
        type: string
    required:
    - credential
    type: object
  handlers.HealthResponse:
    properties:
      status:
        example: ok
        type: string
    type: object
  handlers.LabelListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.LabelResponse'
        type: array
      meta:
        properties:
          current_page:
            type: integer
          last_page:
            type: integer
          total:
            type: integer
        type: object
    type: object
  handlers.LabelRequest:
    properties:
      color:
        type: string
      icon:
        type: string
      name:
        type: string
      slug:
        type: string
      type:
        type: string
    required:
    - color
    - name
    - type
    type: object
  handlers.LabelResponse:
    properties:
      archived_at:
        type: string
      color:
        type: string
      icon:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
      type:
        type: string
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: admin@example.com
        type: string
      password:
        example: password
        type: string
    required:
    - email
    - password
    type: object
  handlers.LoginResponse:
    properties:
      access_token:
        type: string
      expires_in:
        example: 900
        type: integer
      token_type:
        example: Bearer
        type: string
      user:
        $ref: '#/definitions/handlers.UserResponse'
    type: object
  handlers.OwnerCompanyResponse:
    properties:
      address:
        type: string
      city:
        type: string
      country_id:
        type: integer
      currency_id:
        type: integer
      email:
        type: string
      id:
        type: integer
      logo:
        type: string
      name:
        type: string
      phone:
        type: string
      postal_code:
        type: string
      web:
        type: string
    type: object
  handlers.PermissionResponse:
    properties:
      category:
        example: Roles & Permissions
        type: string
      description:
        example: Change which permissions are assigned to a role
        type: string
      id:
        example: 1
        type: integer
      name:
        example: roles.manage
        type: string
    type: object
  handlers.ProjectAccessRequest:
    properties:
      user_ids:
        items:
          type: integer
        type: array
    type: object
  handlers.ProjectCompanyRef:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  handlers.ProjectLabelRef:
    properties:
      color:
        type: string
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  handlers.ProjectListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/handlers.ProjectResponse'
        type: array
      meta:
        properties:
          current_page:
            type: integer
          last_page:
            type: integer
          total:
            type: integer
        type: object
    type: object
  handlers.ProjectRequest:
    properties:
      budget_estimate:
        type: number
      client_company_id:
        type: integer
      client_user_id:
        type: integer
      description:
        type: string
      end_date:
        type: string
      name:
        type: string
      start_date:
        type: string
      status_label_ids:
        items:
          type: integer
        type: array
      type_label_id:
        type: integer
      user_ids:
        items:
          type: integer
        type: array
    required:
    - name
    type: object
  handlers.ProjectResponse:
    properties:
      archived_at:
        type: string
      budget_estimate:
        type: number
      client_company:
        $ref: '#/definitions/handlers.ProjectCompanyRef'
      client_user:
        $ref: '#/definitions/handlers.ProjectUserRef'
      code:
        type: string
      completed_at:
        type: string
      description:
        type: string
      end_date:
        type: string
      id:
        type: integer
      is_completed:
        type: boolean
      name:
        type: string
      start_date:
        type: string
      status_labels:
        items:
          $ref: '#/definitions/handlers.ProjectLabelRef'
        type: array
      type_label:
        $ref: '#/definitions/handlers.ProjectLabelRef'
      users:
        items:
          $ref: '#/definitions/handlers.ProjectUserRef'
        type: array
